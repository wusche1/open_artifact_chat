<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Artifact Chat</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<aside id="sidebar">
  <button id="new-chat">+ New chat</button>
  <nav id="chat-list"></nav>
  <label class="key">OpenRouter key
    <input id="api-key" type="password" placeholder="sk-or-...">
    <a href="https://openrouter.ai/keys" target="_blank">get one</a>
  </label>
</aside>
<main>
  <header>
    <button id="toggle-sidebar">☰</button>
    <select id="artifacts"></select>
  </header>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message…"></textarea>
    <select id="model"></select>
    <button id="send">Send</button>
  </form>
</main>
<section id="artifact" hidden>
  <header>
    <span id="art-title"></span>
    <button id="art-toggle">Code</button>
    <button id="art-newtab">New tab ↗</button>
    <button id="art-download">Download</button>
    <button id="art-close">×</button>
  </header>
  <iframe id="art-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
  <pre id="art-code" hidden></pre>
</section>
<div id="key-gate" hidden>
  <form>
    <h2>Open Artifact Chat</h2>
    <p>Paste your OpenRouter API key to start. It is stored only in this browser.</p>
    <input type="password" placeholder="sk-or-..." required>
    <button>Start</button>
    <p class="error"></p>
    <a href="https://openrouter.ai/keys" target="_blank">Get a key</a>
  </form>
</div>
<div id="other-tab" hidden>
  <form>
    <h2>Open in another tab</h2>
    <p>Open Artifact Chat is already running in another tab. Close it to continue here.</p>
  </form>
</div>
</body>
</html>
